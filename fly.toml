# Deploy on Fly.io (free allowance) — https://fly.io
#   fly launch --copy-config --now        (first time)
#   fly deploy                            (updates)
app = "sentinel-fraud"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
